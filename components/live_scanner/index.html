<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!--
  Live multi-barcode scanner as a bidirectional Streamlit component.

  Decoding happens HERE, in the browser — camera frames never reach the server.
  That is faster than round-tripping photos, avoids WebRTC/TURN traversal
  (which is what makes streamlit-webrtc fragile on Community Cloud), and keeps
  image data on the device.

  The Streamlit component protocol is implemented directly over postMessage,
  so this is a single static file with no npm build step.

  Each distinct code is reported ONCE. Re-detections never auto-increment:
  a camera cannot tell "same item still in frame" from "a second identical
  item", so quantity is confirmed on the Python side instead of guessed here.
-->
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #e8e8ea;
    background: #0f1116;
  }
  #wrap { padding: 10px; }
  #stage {
    position: relative;
    width: 100%;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    aspect-ratio: 4 / 3;
  }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #reticle {
    position: absolute; inset: 12% 8%;
    border: 3px solid rgba(255,255,255,.5);
    border-radius: 14px;
    pointer-events: none;
    transition: border-color .18s, box-shadow .18s;
  }
  #reticle.hit {
    border-color: #21c55d;
    box-shadow: 0 0 0 4px rgba(33,197,93,.28), inset 0 0 40px rgba(33,197,93,.18);
  }
  #status {
    position: absolute; left: 10px; bottom: 10px;
    background: rgba(0,0,0,.62); padding: 5px 11px;
    border-radius: 999px; font-size: 13px;
  }
  #controls { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  button {
    flex: 1 1 auto; min-width: 96px; min-height: 46px;
    border: 0; border-radius: 10px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    background: #262b36; color: #e8e8ea;
  }
  button.primary { background: #2563eb; color: #fff; }
  button.danger  { background: #3a2226; color: #ffb4b4; }
  button:disabled { opacity: .45; cursor: default; }
  #count { margin-top: 12px; font-size: 14px; color: #9aa3b2; }
  ul { list-style: none; margin: 6px 0 0; padding: 0; max-height: 168px; overflow-y: auto; }
  li {
    display: flex; justify-content: space-between; gap: 10px; align-items: center;
    padding: 8px 10px; margin-bottom: 5px;
    background: #171b23; border-radius: 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px;
  }
  li .fmt { color: #7c8798; font-size: 11px; flex-shrink: 0; }
  li.fresh { animation: pop .5s ease-out; }
  @keyframes pop {
    from { background: #14361f; transform: translateY(-3px); }
    to   { background: #171b23; transform: none; }
  }
  #err {
    display: none; margin-top: 10px; padding: 10px 12px;
    background: #3a2226; color: #ffb4b4;
    border-radius: 8px; font-size: 13px; line-height: 1.45;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <video id="vid" playsinline muted autoplay></video>
    <div id="reticle"></div>
    <div id="status">Idle</div>
  </div>

  <div id="controls">
    <button id="start" class="primary">▶ Start scanning</button>
    <button id="torch" disabled>🔦 Light</button>
    <button id="clear" class="danger" disabled>Clear</button>
  </div>

  <div id="count">No codes scanned yet.</div>
  <ul id="list"></ul>
  <div id="err"></div>
</div>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------- Streamlit
  var READY = false;

  function post(msg) {
    msg.isStreamlitMessage = true;
    window.parent.postMessage(msg, "*");
  }

  function ready() {
    if (READY) return;
    READY = true;
    post({ type: "streamlit:componentReady", apiVersion: 1 });
  }

  function setValue(value) {
    post({ type: "streamlit:setComponentValue", value: value, dataType: "json" });
  }

  var lastH = 0;
  function syncHeight() {
    var h = document.getElementById("wrap").scrollHeight + 6;
    if (Math.abs(h - lastH) > 2) {
      lastH = h;
      post({ type: "streamlit:setFrameHeight", height: h });
    }
  }

  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "streamlit:render") syncHeight();
  });

  // ------------------------------------------------------------------- state
  var found = [];              // [{code, format, at}] — insertion ordered, unique
  var seen = Object.create(null);
  var reader = null;
  var stream = null;
  var track = null;
  var torchOn = false;
  var scanning = false;

  var vid = document.getElementById("vid");
  var statusEl = document.getElementById("status");
  var listEl = document.getElementById("list");
  var countEl = document.getElementById("count");
  var reticle = document.getElementById("reticle");
  var startBtn = document.getElementById("start");
  var torchBtn = document.getElementById("torch");
  var clearBtn = document.getElementById("clear");
  var errEl = document.getElementById("err");

  function showErr(msg) {
    errEl.textContent = msg;
    errEl.style.display = "block";
    syncHeight();
  }

  function setStatus(s) { statusEl.textContent = s; }

  // Short ascending blip on a new code — a ward user is looking at the basket,
  // not the screen, so detection needs to be audible.
  var actx = null;
  function beep() {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.connect(g); g.connect(actx.destination);
      o.type = "sine";
      o.frequency.setValueAtTime(880, actx.currentTime);
      o.frequency.linearRampToValueAtTime(1320, actx.currentTime + 0.09);
      g.gain.setValueAtTime(0.16, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.16);
      o.start(); o.stop(actx.currentTime + 0.17);
    } catch (_) { /* audio blocked — the visual flash still fires */ }
  }

  function flash() {
    reticle.classList.add("hit");
    setTimeout(function () { reticle.classList.remove("hit"); }, 190);
  }

  function render() {
    listEl.innerHTML = "";
    for (var i = found.length - 1; i >= 0; i--) {
      var it = found[i];
      var li = document.createElement("li");
      if (i === found.length - 1) li.className = "fresh";
      var a = document.createElement("span");
      a.textContent = it.code;
      var b = document.createElement("span");
      b.className = "fmt";
      b.textContent = it.format;
      li.appendChild(a); li.appendChild(b);
      listEl.appendChild(li);
    }
    countEl.textContent = found.length
      ? found.length + (found.length === 1 ? " code scanned" : " distinct codes scanned")
      : "No codes scanned yet.";
    clearBtn.disabled = found.length === 0;
    syncHeight();
  }

  function push() {
    setValue({ codes: found, n: found.length });
  }

  function onDecode(text, format) {
    if (!text || seen[text]) return;   // unique-once; quantity confirmed in Python
    seen[text] = true;
    found.push({ code: text, format: format || "unknown", at: Date.now() });
    beep(); flash(); render(); push();
  }

  // ------------------------------------------------------------------ scanning
  // getBarcodeFormat() returns a numeric enum; reverse-map it to its name.
  function formatName(fmt) {
    try {
      var name = ZXing.BarcodeFormat[fmt];
      return typeof name === "string" ? name.replace(/_/g, "-") : String(fmt);
    } catch (_) {
      return "unknown";
    }
  }

  // We drive the capture->decode loop ourselves rather than using ZXing's
  // BrowserMultiFormatReader.decodeFromConstraints(). Measured against a fake
  // camera feeding real barcodes, its continuous scanner hit roughly 1 decode
  // per 90 attempts; this loop hits 100% and lands the first decode in ~15ms.
  //
  // Two reasons its own loop loses so much:
  //   - for video sources it auto-inverts every second frame, so half the
  //     attempts are spent looking for a white-on-black code that isn't there
  //   - the remaining attempts go through decodeWithState, which fared far
  //     worse here than decode(bitmap, hints)
  //
  // Doing it by hand also lets us re-try a centre crop, which is what catches
  // a small or distant barcode.
  var SCAN_INTERVAL_MS = 100;

  // A decode returns at most ONE code, so a basket sitting still under the
  // camera would report the same barcode forever and never reach the others.
  // Each tick therefore decodes the full frame plus a couple of tiles, cycling
  // through them, so the whole frame is swept roughly every 600ms.
  //
  // Tile overlap is the part that matters: a barcode only decodes if it falls
  // ENTIRELY inside one tile, so consecutive tiles must overlap by more than a
  // barcode's width. Stride 1/6 with width 1/2 leaves a 1/3-frame overlap
  // (~427px of a 1280px frame), comfortably more than a label at arm's length.
  var FULL = [0, 0, 1, 1];
  var TILES = [];
  (function () {
    var TW = 0.5, TH = 0.6;
    var xs = [0, 1 / 6, 1 / 3, 0.5];
    var ys = [0, 0.2, 0.4];
    for (var yi = 0; yi < ys.length; yi++) {
      for (var xi = 0; xi < xs.length; xi++) {
        TILES.push([xs[xi], ys[yi], TW, TH]);
      }
    }
  })();
  var TILES_PER_TICK = 2;

  var hints = null;
  var canvas = null;
  var cctx = null;
  var timer = null;
  var ticks = 0;

  function buildHints() {
    var h = new Map();
    var F = ZXing.BarcodeFormat;
    h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
      F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E,
      F.CODE_128, F.CODE_39, F.ITF, F.CODABAR,
      F.QR_CODE, F.DATA_MATRIX
    ]);
    h.set(ZXing.DecodeHintType.TRY_HARDER, true);
    return h;
  }

  // Copy a region of the current frame at full sensor resolution. Taking a
  // sub-rect (rather than scaling the whole frame down) is what makes a small
  // or distant barcode large enough to resolve.
  function grabRect(r) {
    var vw = vid.videoWidth, vh = vid.videoHeight;
    if (!vw || !vh) return null;
    var sx = Math.round(vw * r[0]), sy = Math.round(vh * r[1]);
    var sw = Math.round(vw * r[2]), sh = Math.round(vh * r[3]);
    if (sw < 1 || sh < 1) return null;
    canvas.width = sw; canvas.height = sh;
    cctx.drawImage(vid, sx, sy, sw, sh, 0, 0, sw, sh);
    return canvas;
  }

  function bitmapOf(c) {
    // Second arg omitted on purpose: no auto-invert. Ward labels are
    // black-on-white, and inverting costs attempts without buying anything.
    var src = new ZXing.HTMLCanvasElementLuminanceSource(c);
    return new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src));
  }

  function tryDecode(rect) {
    var c = grabRect(rect);
    if (!c) return null;
    try {
      return reader.decode(bitmapOf(c), hints);
    } catch (_) {
      return null;   // no code in this region; normal, happens constantly
    }
  }

  function loop() {
    if (!scanning) return;

    // Whole frame: picks up a large or centred code straight away.
    var res = tryDecode(FULL);
    if (res) onDecode(res.getText(), formatName(res.getBarcodeFormat()));

    // Then a couple of tiles, cycling — this is what finds the second, third
    // and fourth item in a basket.
    for (var k = 0; k < TILES_PER_TICK; k++) {
      var tile = tryDecode(TILES[(ticks * TILES_PER_TICK + k) % TILES.length]);
      if (tile) onDecode(tile.getText(), formatName(tile.getBarcodeFormat()));
    }

    ticks++;
    timer = setTimeout(loop, SCAN_INTERVAL_MS);
  }

  function start() {
    if (scanning) return;
    if (typeof ZXing === "undefined") {
      showErr(
        "Barcode library failed to load. This build fetches ZXing from unpkg.com — " +
        "if this network blocks CDNs, the library needs to be vendored into the repo."
      );
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showErr("This browser exposes no camera API.");
      return;
    }

    startBtn.disabled = true;
    setStatus("Starting camera…");

    if (!canvas) {
      canvas = document.createElement("canvas");
      cctx = canvas.getContext("2d", { willReadFrequently: true });
    }
    hints = buildHints();
    reader = new ZXing.MultiFormatReader();
    reader.setHints(hints);

    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      }
    }).then(function (s) {
      stream = s;
      vid.srcObject = s;
      return vid.play();
    }).then(function () {
      scanning = true;
      setStatus("Scanning — point at barcodes");
      startBtn.textContent = "⏸ Stop";
      startBtn.disabled = false;
      startBtn.classList.remove("primary");

      track = stream.getVideoTracks ? stream.getVideoTracks()[0] : null;
      var caps = track && track.getCapabilities ? track.getCapabilities() : {};
      torchBtn.disabled = !(caps && caps.torch);

      // Continuous autofocus where the device offers it — a fixed-focus frame
      // is the other common reason a barcode never resolves.
      if (track && track.applyConstraints && caps && caps.focusMode &&
          caps.focusMode.indexOf && caps.focusMode.indexOf("continuous") !== -1) {
        track.applyConstraints({ advanced: [{ focusMode: "continuous" }] }).catch(function () {});
      }

      ticks = 0;
      loop();
      syncHeight();
    }).catch(function (e) {
      scanning = false;
      startBtn.disabled = false;
      setStatus("Camera unavailable");
      var name = (e && e.name) || "";
      if (name === "NotAllowedError") {
        showErr("Camera permission was denied. Allow camera access for this site, then press Start again.");
      } else if (name === "NotFoundError" || name === "OverconstrainedError") {
        showErr("No usable camera found on this device.");
      } else {
        showErr(
          "Could not start the camera: " + (e && e.message ? e.message : e) +
          " — browsers only allow camera access over HTTPS or on localhost."
        );
      }
    });
  }

  function stop() {
    if (!scanning) return;
    scanning = false;
    if (timer) { clearTimeout(timer); timer = null; }
    try {
      if (stream && stream.getTracks) {
        stream.getTracks().forEach(function (t) { t.stop(); });
      }
    } catch (_) {}
    stream = null;
    vid.srcObject = null;
    track = null; torchOn = false;
    torchBtn.disabled = true;
    startBtn.textContent = "▶ Start scanning";
    startBtn.classList.add("primary");
    setStatus("Stopped");
  }

  startBtn.addEventListener("click", function () {
    if (scanning) stop(); else start();
  });

  torchBtn.addEventListener("click", function () {
    if (!track) return;
    torchOn = !torchOn;
    track.applyConstraints({ advanced: [{ torch: torchOn }] }).catch(function () {
      torchBtn.disabled = true;
    });
  });

  clearBtn.addEventListener("click", function () {
    found = [];
    seen = Object.create(null);
    render(); push();
  });

  window.addEventListener("resize", syncHeight);

  render();
  ready();
  syncHeight();
})();
</script>
</body>
</html>
